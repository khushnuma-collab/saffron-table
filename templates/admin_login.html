{% extends "base.html" %}

{% block title %}
Admin Login | Saffron Table
{% endblock %}


{% block content %}

<main class="admin-login-page">

    <section class="admin-login-section">

        <div class="admin-login-container">

            <p class="section-eyebrow">
                ADMIN PANEL
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="admin-login-subtitle">
                Login to manage Saffron Table reservations.
            </p>


            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                action="{{ url_for('admin_login') }}"
                method="POST"
                class="admin-login-form"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary admin-login-btn"
                >
                    Login
                </button>

            </form>

        </div>

    </section>

</main>

{% endblock %}
